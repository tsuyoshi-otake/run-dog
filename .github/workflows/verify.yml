name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Each cargo invocation is its own step. A single pwsh script that chains
      # cargo fmt/clippy/test/build can report success when only the last
      # native command exits 0 (PSNativeCommandUseErrorActionPreference is
      # false by default; GHA only prepends ErrorActionPreference=Stop).
      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: release build
        run: cargo build --release
